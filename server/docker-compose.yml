version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: gunicorn --workers 3 --bind :8025 MMonitor.wsgi:application
    volumes:
      - ./:/app
      - ../frontend/dist:/frontend/dist:ro
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/nginx/ssl:/etc/nginx/ssl
      - static_volume:/static
      - media_volume:/media
    depends_on:
      - web

volumes:
  static_volume:
  media_volume:
