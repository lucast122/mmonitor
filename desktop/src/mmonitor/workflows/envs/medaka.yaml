# Snakemake environment for Medaka polishing
# PyTorch is installed from the pytorch channel to match the system CUDA driver.
# Medaka is installed via pip on top.
# Python is pinned to <3.13 for medaka pip compatibility.
name: mmonitor-smk-medaka
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.10,<3.13
  - samtools>=1.21
  - minimap2>=2.28
  - pytorch::pytorch>=2.0
  - pytorch-cuda=12.4
  - pip
  - pip:
    - medaka>=2.2.0
