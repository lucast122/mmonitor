# Snakemake environment for assembly rules
# Note: medaka has its own environment (medaka.yaml) for GPU auto-detection
name: mmonitor-smk-assembly
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.10
  - pandas
  - flye>=2.9.5
  - minimap2>=2.28
  - samtools>=1.21
  - metabat2>=2.17
  - seqkit>=2.10
